# Standard R package check workflow from r-lib/actions
# Runs R CMD check on Linux, macOS, and Windows on every push and PR

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
        - {os: macos-latest, r: 'release'}
        - {os: windows-latest, r: 'release'}
        - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
        - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
    - uses: actions/checkout@v6

    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.config.r }}
        http-user-agent: ${{ matrix.config.http-user-agent }}
        use-public-rspm: true

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::rcmdcheck
        needs: check

    - name: Verify validation dependencies
      shell: Rscript {0}
      run: |
        description <- read.dcf("DESCRIPTION")
        fields <- intersect(c("Imports", "Suggests"), colnames(description))
        dependencies <- trimws(unlist(strsplit(paste(description[1, fields], collapse = ","), ",")))
        packages <- sub("[[:space:]]*\\(.*\\)$", "", dependencies)
        available <- vapply(packages, requireNamespace, logical(1), quietly = TRUE)
        if (any(!available))
          stop("Missing validation dependencies: ", paste(packages[!available], collapse = ", "))
        print(vapply(packages, function(p) as.character(packageVersion(p)), character(1)))
        sessionInfo()

    - uses: r-lib/actions/check-r-package@v2
      with:
        upload-snapshots: true
        error-on: '"error"'
